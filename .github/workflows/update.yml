name: u
on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
jobs:
  u:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          u=$(curl -s -L -o /dev/null -w "%{url_effective}" https://dnull.xyz/latest_bs || echo "")
          f=$(basename "$u")
          if [[ "$f" == *.apk* ]]; then
            echo "{\"file\": \"$f\"}" > version.json
          else
            echo "Keep old version"
          fi
      - run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add version.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "u" && git push)
