name: Update Version

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

concurrency:
  group: update-version
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Fetch latest version
        run: |
          python - << 'EOF'
          import urllib.request
          import urllib.parse
          import json
          import time
          import random
          from pathlib import Path

          time.sleep(random.randint(1, 15))

          target_url = "https://dnull.xyz/latest_bs"
          
          headers = {
              "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36",
              "Accept": "text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,image/apng,*/*;q=0.8",
              "Accept-Language": "en-US,en;q=0.9,ru;q=0.8",
              "Sec-Ch-Ua": '"Not-A.Brand";v="99", "Chromium";v="124", "Google Chrome";v="124"',
              "Sec-Ch-Ua-Mobile": "?0",
              "Sec-Ch-Ua-Platform": '"Windows"',
              "Sec-Fetch-Dest": "document",
              "Sec-Fetch-Mode": "navigate",
              "Sec-Fetch-Site": "none",
              "Sec-Fetch-User": "?1",
              "Upgrade-Insecure-Requests": "1"
          }

          class CustomHTTPRedirectHandler(urllib.request.HTTPRedirectHandler):
              def http_error_302(self, req, fp, code, msg, headers):
                  return super().http_error_302(req, fp, code, msg, headers)
              http_error_301 = http_error_303 = http_error_307 = http_error_308 = http_error_302

          opener = urllib.request.build_opener(CustomHTTPRedirectHandler)
          req = urllib.request.Request(target_url, headers=headers, method="HEAD")

          try:
              with opener.open(req, timeout=15) as response:
                  final_url = response.geturl()
                  print(f"Resolved URL: {final_url}")
                  
                  path = urllib.parse.urlparse(final_url).path
                  filename = Path(path).name

                  if filename.endswith(".apk"):
                      print(f"Successfully found APK: {filename}")
                      data = {"file": filename}
                      with open("version.json", "w", encoding="utf-8") as f:
                          json.dump(data, f, indent=2)
                  else:
                      print(f"URL does not point to an APK: '{filename}'. Keeping current version.")
          except Exception as e:
              print(f"Error fetching version: {e}")
          EOF

      - name: Commit and push if changed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add version.json
          
          if ! git diff --staged --quiet; then
            new_file=$(jq -r '.file' version.json 2>/dev/null || echo "update")
            git commit -m "chore(version): update to $new_file"
            git push origin HEAD
          else
            echo "No changes to commit."
          fi
